<!-- STRUKTUR HTML  -->
<!doctype html>
<html lang="id">
  <head>
    <title>Kopi Nusantara</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <!-- TATA LETAK (Layout) -->
  <body>
    <!-- 🟢 bagian HEADER  -->
    <header class="site-header">
      <!-- bagian BRAND -->
      <div class="brand">
        <!-- bagian LOGO -->
        <img src="img/logo.png" alt="Logo Kopi Nusantara" class="logo" />
        <!-- bagian NAMA WEBSITE & TAGLINE -->
        <div>
          <!-- NAMA WEBSITE -->
          <h1 class="site-title">Kopi Nusantara</h1>
          <!-- TAGLINE -->
          <p class="tagline">Seduh semangat, nikmati Indonesia</p>
        </div>
      </div>
      <!-- bagian NAVIGASI - MAIN MENU  -->
      <nav class="main-menu" aria-label="Menu utama">
        <ul id="menu"></ul>
      </nav>
    </header>
    <!-- 🟢 bagian CONTENT -->
    <main class="site-content">
      <!-- 🔸 sub bagian untuk Beranda -->
      <section id="produk">
        <h2>Produk Kami</h2>
        <div class="filter" id="filter-produk"></div>
        <!-- pencarian slug -->
        <h3>Pencarian dengan Slug</h3>
        <p>Masukkan kata kunci slug:</p>
        <input type="text" id="inputSlug" placeholder="Contoh: kintamani" />
        <br />
        <button onclick="cariSlug()" class="btn">Cari</button>
        <div id="hasilCari"></div>
        <p class="meta" id="jumlah-produk"></p>
        <div class="grid" id="daftar-produk"></div>
      </section>
      <!-- 🔸 sub bagian untuk Kontak -->
      <section id="kontak">
        <h2>Hubungi Kami</h2>
        <p>Email: halo@kopinusantara.test</p>
        <form id="form-kontak" novalidate>
          <label>Nama <input type="text" name="nama" /></label>
          <label>Pesan <textarea name="pesan" rows="4"></textarea></label>
          <button type="submit" class="btn">Kirim</button>
          <p id="form-status" role="status"></p>
        </form>
      </section>
    </main>
    <!-- 🟢 bagian FOOTER -->
    <footer class="site-footer">
      <p>
        &copy; <span id="tahun"></span> Kopi Nusantara. Hak cipta dilindungi.
      </p>
    </footer>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
